<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Find Collaboration</title>
    
    <!-- 🎯 PINTEREST VERIFICATION TAG (यहाँ सही जगह सेट कर दिया है) -->
    <meta name="pdomain_verify" content="414455f1315dbc0b94d7fc45f3a6f203"/>

    <!-- Tailwind CSS (डिजाइन के लिए) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-black via-zinc-900 to-zinc-800 flex items-center justify-center p-6">

    <div class="w-full max-w-4xl grid md:grid-cols-2 overflow-hidden rounded-3xl shadow-2xl border border-zinc-700 bg-zinc-900/90 backdrop-blur-lg"> 
        
        <!-- Left Side: Budget Find Collaboration --> 
        <div class="p-10 bg-gradient-to-b from-indigo-600 to-purple-700 text-white flex flex-col justify-center"> 
            <h1 class="text-4xl font-bold leading-tight"> Budget Find <br /> Collaboration </h1>

            <p class="mt-5 text-zinc-200 text-base leading-relaxed">
                Connect with premium creators, brands, and influencers. Fill out the collaboration form and start growing your network professionally.
            </p>

            <div class="mt-8 space-y-4">
                <div class="flex items-center gap-3">
                    <div class="w-3 h-3 rounded-full bg-green-400"></div>
                    <p>Trusted Collaboration Platform</p>
                </div>

                <div class="flex items-center gap-3">
                    <div class="w-3 h-3 rounded-full bg-pink-400"></div>
                    <p>Secure Premium Application</p>
                </div>

                <div class="flex items-center gap-3">
                    <div class="w-3 h-3 rounded-full bg-yellow-400"></div>
                    <p>Fast Approval Process</p>
                </div>
            </div>
        </div>

        <!-- Right Side: IPL Jersey Customization Form -->
        <div class="p-10 bg-zinc-950 text-white">
            <div class="mb-8">
                <h2 class="text-3xl font-bold">Apply Now</h2>
                <p class="text-zinc-400 mt-2">
                    Submit your collaboration request.
                </p>
            </div>

            <!-- आपका ओरिजिनल IPL जर्सी वाला फ़ॉर्म -->
            <form class="space-y-5" onsubmit="event.preventDefault(); alert('Application submitted successfully!');">
                <div>
                    <label class="block mb-2 text-sm text-zinc-300">Full Name</label>
                    <input type="text" placeholder="Enter your full name" class="w-full px-4 py-3 rounded-2xl bg-zinc-900 border border-zinc-700 focus:outline-none focus:ring-2 focus:ring-indigo-500" required />
                </div>

                <div>
                    <label class="block mb-2 text-sm text-zinc-300">Email Address</label>
                    <input type="email" placeholder="example@email.com" class="w-full px-4 py-3 rounded-2xl bg-zinc-900 border border-zinc-700 focus:outline-none focus:ring-2 focus:ring-indigo-500" required />
                </div>

                <div>
                    <label class="block mb-2 text-sm text-zinc-300">Phone Number</label>
                    <input type="tel" placeholder="Enter your phone number" class="w-full px-4 py-3 rounded-2xl bg-zinc-900 border border-zinc-700 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                </div>

                <!-- IPL JERSEY NAME SELECTION -->
                <div>
                    <label class="block mb-2 text-sm text-zinc-300">Jersey Name</label>
                    <input type="text" placeholder="Name to print on Jersey" class="w-full px-4 py-3 rounded-2xl bg-zinc-900 border border-zinc-700 focus:outline-none focus:ring-2 focus:ring-indigo-500" required />
                </div>

                <!-- IPL JERSEY NUMBER SELECTION -->
                <div>
                    <label class="block mb-2 text-sm text-zinc-300">Jersey Number</label>
                    <input type="number" placeholder="Jersey Number (e.g. 7, 18, 45)" class="w-full px-4 py-3 rounded-2xl bg-zinc-900 border border-zinc-700 focus:outline-none focus:ring-2 focus:ring-indigo-500" required />
                </div>

                <!-- IPL TEAM SELECTION -->
                <div>
                    <label class="block mb-2 text-sm text-zinc-300">Select IPL Team / Collaboration Type</label>
                    <select class="w-full px-4 py-3 rounded-2xl bg-zinc-900 border border-zinc-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option>Mumbai Indians (MI)</option>
                        <option>Chennai Super Kings (CSK)</option>
                        <option>Royal Challengers Bengaluru (RCB)</option>
                        <option>Kolkata Knight Riders (KKR)</option>
                        <option>Gujarat Titans (GT)</option>
                        <option>Delhi Capitals (DC)</option>
                        <option>Punjab Kings (PBKS)</option>
                        <option>Rajasthan Royals (RR)</option>
                        <option>Sunrisers Hyderabad (SRH)</option>
                        <option>Lucknow Super Giants (LSG)</option>
                    </select>
                </div>

                <div>
                    <label class="block mb-2 text-sm text-zinc-300">Budget Range</label>
                    <input type="text" placeholder="$100 - $5000" class="w-full px-4 py-3 rounded-2xl bg-zinc-900 border border-zinc-700 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                </div>

                <div>
                    <label class="block mb-2 text-sm text-zinc-300">Message</label>
                    <textarea rows="4" placeholder="Tell us about your collaboration project..." class="w-full px-4 py-3 rounded-2xl bg-zinc-900 border border-zinc-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none"></textarea>
                </div>

                <button type="submit" class="w-full py-3 rounded-2xl bg-gradient-to-r from-indigo-500 to-purple-600 hover:scale-[1.02] transition-all duration-300 font-semibold shadow-lg cursor-pointer">
                    Submit Application
                </button>
            </form>
        </div>
    </div>

</body>
</html>
